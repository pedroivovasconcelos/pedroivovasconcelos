name: WakaTime Status

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether WakaTime is configured
        id: preflight
        shell: bash
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [[ -n "$WAKATIME_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WAKATIME_API_KEY is not configured; README update skipped successfully."
          fi

      - uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6 # master 2026-08-09
        if: steps.preflight.outputs.configured == 'true'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          BLOCKS: '->'
          TIME_RANGE: last_7_days
          SHOW_TIME: true
          SHOW_MASKED_TIME: false

      - name: Confirm optional integration skip
        if: steps.preflight.outputs.configured != 'true'
        run: echo "WakaTime integration is optional and remains disabled."
